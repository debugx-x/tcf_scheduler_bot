# Copy to config.yaml (./setup.sh does this) and fill in. config.yaml is
# gitignored. Secrets — AF login, card, Telegram token — go in .env instead.

candidate:
  first_name: Jane
  last_name: Doe
  email: you@example.com
  phone: "+1 604 555 0123"
  date_of_birth: "Jan 15 1995"          # the form's format: MMM DD YYYY
  gender: ""                            # "" / "m" / "f"

  passport_number: ""                   # as printed on your passport
  id_number: ""                         # use this instead if no passport
  candidate_number: ""                  # from a previous TCF; blank if none

  # Dropdowns. AF Canada lists these options IN FRENCH even on the English
  # site (its own hint: "For English, search 'anglais'"). Put the French name
  # first; a list is tried in order. Examples: India -> Inde, China -> Chine,
  # United States -> États-Unis, English -> Anglais, Spanish -> Espagnol.
  mother_tongue: [Hindi]
  nationality: [Inde, India]
  country_of_birth: [Inde, India]
  city_of_birth: "New Delhi"            # free text

  # Mailing address
  address_line1: "123 Main St"
  address_line2: ""
  city: Vancouver
  province: BC
  postal_code: V6B0A1
  country: [Canada]

  has_disability: ["Non", "No"]         # keep the quotes — YAML reads bare No as false

  # Required consents — the form won't submit without them.
  acknowledge_french_law: true
  agree_to_terms: true

  # Fields you answer through the Telegram fallback are saved here automatically.

date_strategy:
  # earliest_with_fallback: book ONE exam — the earliest exam date available
  # in the next release — then stop. To book specific dates (or several),
  # use target_dates below instead.
  mode: earliest_with_fallback

  # Which AF Vancouver site(s) you'll sit the exam at, most preferred first:
  #   vancouver        — 6161 Cambie St., Vancouver
  #   new_westminster  — 320 Columbia St., New Westminster
  # Empty list = either site. With both listed, the same date at your first
  # site is tried first and the second site is the fallback if it sells out.
  # The two sites release seats on different days; the bot schedules a strike
  # for each release and remembers what it booked (state/booked.json).
  locations: []          # e.g. [vancouver] or [new_westminster, vancouver]

  # Optional exam-date bounds for earliest mode (ISO YYYY-MM-DD, inclusive).
  min_exam_date: ""      # e.g. "2027-01-15" to skip earlier exams
  max_exam_date: ""      # e.g. "2027-03-31" to skip later exams

  # Book EVERY date listed here. Overrides `mode` and the bounds above when
  # non-empty. All seats are held first, then paid one by one, in a single
  # browser tab (AF warns that multiple tabs can cancel a reservation). Mind
  # the 20-day retake rule between sittings. Accepts "January 15, 2027" or
  # "2027-01-15". To choose the site for one date, use a mapping:
  #   target_dates:
  #     - "January 15, 2027"                  # uses `locations` above
  #     - date: "February 8, 2027"
  #       locations: [new_westminster]        # this date: New Westminster only
  target_dates: []
  # If a listed date isn't offered, book the nearest date within this many
  # days instead — only if it stays >= min_gap_days from your other bookings.
  # 0 = exact dates only.
  substitute_tolerance_days: 14
  min_gap_days: 20       # TCF retake rule; applies to substituted dates only

site:
  target: af_canada
  af_canada_base_url: "https://www.alliancefrancaise.ca"
  af_canada_tcf_path: "/en/language/exams/tcf-canada/"
  # AF San Diego (same platform) is only used by `tcf dry-run --site sandiego`.
  af_sandiego_base_url: "https://www.afsandiego.org"
  af_sandiego_tcf_path: "/certifications/tcf/tcf-canada/"

scout:
  poll_interval_minutes: 15              # how often `tcf schedule` re-checks the listing
  notify_when_opens_within_hours: 24     # Telegram heads-up this far ahead of a release

strike:
  # Start (browser + login) this many seconds before registration opens.
  prewarm_seconds: 90
  # How often the race polls the public listing (milliseconds; floor 250).
  poll_interval_ms: 250
  # Give up on a race after this many seconds. Also how late a strike may
  # start if the computer wakes up late.
  total_budget_seconds: 600
  # Keep false: you can watch the browser and take over if something breaks.
  headless: false
  # On failure, leave the browser open this long so you can finish by hand
  # inside AF's 10-minute hold. 0 closes immediately.
  keep_open_on_failure_seconds: 540

notifications:
  telegram:
    chat_id: "123456789"                 # see README → Telegram bot setup
  email:                                 # only used if SMTP is set in .env
    to: you@example.com
    from: "TCF Bot <you@example.com>"

interactive_fallback:
  # When the form has a field your config doesn't cover, ask via Telegram.
  enabled: true
  timeout_seconds: 120
