[project]
name = "tcf-bot"
version = "0.1.0"
description = "Personal bot for booking TCF Canada exam slots at AF Vancouver"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "python-telegram-bot>=21",
    "pydantic[email]>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
tcf = "tcf_bot.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcf_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
